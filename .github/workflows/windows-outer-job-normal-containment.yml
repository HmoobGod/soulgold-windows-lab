        $known = @'
        [{"path":"C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64\\Kernel32.lib","bytes":311908,"sha256":"842f5ce7ad8cf5aab7491b791e7968d2be510ae93f4019d3311797289399d221"},{"path":"C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64\\Bcrypt.lib","bytes":14576,"sha256":"9fe31df255d17b0339391ff80a71bf2c5d442cc301bd2fe6eeea00b626f10785"},{"path":"C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\ucrt\\x64\\ucrt.lib","bytes":285588,"sha256":"7ef4eac926bf597d2f243f16cdfed7e0db22cb3ca34a1d7e088a84c994a03d66"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64\\msvcrt.lib","bytes":8031888,"sha256":"07670951a39739b6d1b50421ae61707ef23c8dff50cdf35f99408711478f3a7c"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64\\vcruntime.lib","bytes":285940,"sha256":"1acbd98b43a4be8373e25c65dcae4412f36f6111d6b64e47e4a2a97a1d16b27b"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64\\msvcprt.lib","bytes":4050616,"sha256":"59d3ab1065f0a14bd9b27debef4008a91eafbc7411290013f61091bf12dfca0f"}]
