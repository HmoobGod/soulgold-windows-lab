            Require ($remaining -gt 0 -and $err.Wait([int]$remaining)) 'Guardian stderr deadline; HOLD'
            $elapsed = $clock.ElapsedMilliseconds
            Write-Host ('Guardian first line: ' + (ConvertTo-Json -InputObject $line -Compress))
            Require ($elapsed -lt 25000 -and $p.ExitCode -eq 0 -and [string]::IsNullOrEmpty($rest.Result) -and [string]::IsNullOrEmpty($err.Result)) 'Guardian did not exit cleanly within independent deadline; HOLD'
            # Strict whole-line schema; no promotion of a partial/late/quarantined witness.
            $pattern = '\Averdict=PASS_RESUME_CONTAINMENT_ONLY reason=NORMAL_CASE creation_unknown=0 watchdog_trusted=1 child_trusted=1 watchdog_resumed=1 child_resume_request_verified=1 child_body_execution_verified=0 evidence_scope=RESUME_AND_CONTAINMENT_ONLY death_observed=0 death_child_live=0 terminate_ok=1 watchdog_exit=1 child_exit=1 outer_empty=1 explicit_job_release=1 deadline_ok=1 teardown_ms=(?<ms>[0-9]{1,4}) watchdog_pid=(?<w>[1-9][0-9]{0,9}) child_pid=(?<c>[1-9][0-9]{0,9}) terminate_error=0 release_error=0\z'
            $m = [regex]::Match([string]$line,$pattern,[Text.RegularExpressions.RegexOptions]::CultureInvariant)
            Require ($m.Success) 'Exact normal containment witness missing; HOLD'
            $wp = [long]$m.Groups['w'].Value; $cp = [long]$m.Groups['c'].Value
            Require ([int]$m.Groups['ms'].Value -lt 8000 -and $wp -le [uint32]::MaxValue -and $cp -le [uint32]::MaxValue -and $wp -ne $cp -and $wp -ne $guardianPid -and $cp -ne $guardianPid) 'Teardown deadline or process identity mismatch'
            Require ((Hash $original) -ceq $c.source_sha256 -and (Hash $copy) -ceq $c.disposable_source_sha256 -and (Hash $obj) -ceq $c.object_sha256 -and (Hash $exe) -ceq $expected -and (Hash $compilePath) -ceq $compileHash -and (Hash $linkPath) -ceq $linkHash) 'Post-run identity changed; HOLD'
            $result = [ordered]@{schema='sg-normal-resume-containment-v1';result='PASS_RESUME_CONTAINMENT_ONLY_REVIEW_REQUIRED';workflow_commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;prior_build_run='45320253569';prior_build_artifact='14887580732';first_deterministic_run='45318734222';first_metadata_artifact='14887007514';first_comparison_artifact='14886218693';first_reproducibility_receipt_sha256='88f2578126bd45f505f677c3bfd47a3052736950c784dc6ba4ca499acef23da2';second_comparison_artifact='14887306696';second_reproducibility_receipt_sha256='5c3a5f936a915cbb279766780a071ab9c9791d67ee03118deaf528735645157b';deterministic_workflow_commit='7c9d4d7f85f3a5c5fa4f05d47885b0654edbe569';deterministic_workflow_blob='bb3ae477c0527604ee84aad70a60ae9ee8e2e006';object_sha256=$expectedObject;compile_receipt_sha256=$compileHash;link_receipt_sha256=$linkHash;executable_sha256=$expected;guardian_pid=$guardianPid;guardian_exit_code=0;guardian_wall_ms=$elapsed;guardian_line=$line;scenario='normal';child_body_execution_verified=$false;watchdog_death_case_verified=$false;interruption_rollback_verified=$false;vm_decommission_observed=$false;emulator_executed=$false;gameplay_native_authorized=$false;gameplay_acceptance='0/20'}
            $path = Join-Path $receipt 'normal-containment-receipt.json'
            Require (-not (Test-Path -LiteralPath $path)) 'Receipt already exists'
            [IO.File]::WriteAllText($path,($result | ConvertTo-Json -Depth 6),[Text.UTF8Encoding]::new($false))
            Write-Host 'PASS_RESUME_CONTAINMENT_ONLY_REVIEW_REQUIRED'
          } finally { $p.Dispose() }
        } finally { $locked.Dispose() }
    - name: Export successful normal containment metadata only
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: normal-containment-receipt-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/sg-outer-job-compile-only/receipt/normal-containment-receipt.json
        if-no-files-found: error
        retention-days: 7
        overwrite: false
