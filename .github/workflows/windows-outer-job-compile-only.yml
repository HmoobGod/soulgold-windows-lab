name: SoulGold harmless Win32 fixture (object only)
'on':
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Separate owner approval required: I_AUTHORIZE_ONE_DISPOSABLE_OBJECT_ONLY_COMPILE'
        required: true
        type: string
permissions: {}
concurrency:
  group: sg-outer-job-compile-only
  cancel-in-progress: false
jobs:
  compile-only:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SG_COMPILE_AUTHORIZATION: ${{ inputs.authorization }}
    steps:
      - name: Remeasure and compare exact baseline toolchain
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          function Require([bool]$condition, [string]$message) {
            if (-not $condition) { throw $message }
          }
          function SafeItem([string]$path, [bool]$directory) {
            $item = Get-Item -LiteralPath $path -Force
            Require ($item.PSIsContainer -eq $directory) "Wrong item type: $path"
            Require (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) "Reparse point refused: $path"
            return $item
          }
          function SafeRoot([string]$path) {
            $full = [IO.Path]::GetFullPath($path)
            $cursor = $full
            while ($null -ne $cursor) {
              $null = SafeItem $cursor $true
              $parent = [IO.Directory]::GetParent($cursor)
              if ($null -eq $parent) { break }
              $cursor = $parent.FullName
            }
            return (SafeItem $full $true).FullName
          }
          function MeasureFile([string]$path) {
            $before = SafeItem $path $false
            $size = $before.Length
            $stamp = $before.LastWriteTimeUtc.Ticks
            $hash = (Get-FileHash -LiteralPath $before.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $after = SafeItem $path $false
            Require ($after.Length -eq $size -and $after.LastWriteTimeUtc.Ticks -eq $stamp) "File changed during hashing: $path"
            Require ($hash -cmatch '^[0-9a-f]{64}$') "Invalid hash: $path"
            return [ordered]@{ path = $after.FullName; bytes = $size; sha256 = $hash }
          }
          function AssertX64PE([string]$path) {
            $stream = [IO.File]::OpenRead($path)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              Require ($stream.Length -ge 64) "Short PE: $path"
              Require ($reader.ReadUInt16() -eq 0x5A4D) "Missing MZ: $path"
              $stream.Position = 0x3c
              $offset = $reader.ReadUInt32()
              Require ($offset -ge 64 -and [long]$offset + 6 -le $stream.Length) "Invalid PE offset: $path"
              $stream.Position = $offset
              Require ($reader.ReadUInt32() -eq 0x4550) "Missing PE signature: $path"
              Require ($reader.ReadUInt16() -eq 0x8664) "Not x64 PE: $path"
            } finally { $stream.Dispose() }
          }
          function MeasureCritical([string]$path) {
            $row = MeasureFile $path
            AssertX64PE $row.path
            $version = (SafeItem $path $false).VersionInfo
            $signature = Get-AuthenticodeSignature -LiteralPath $row.path
            $row['file_version'] = $version.FileVersion
            $row['product_version'] = $version.ProductVersion
            $row['file_version_parts'] = @($version.FileMajorPart, $version.FileMinorPart, $version.FileBuildPart, $version.FilePrivatePart)
            $row['machine'] = 'AMD64'
            $row['signature_status'] = [string]$signature.Status
            $row['signature_type'] = [string]$signature.SignatureType
            $row['signer_subject'] = $null
            $row['signer_cert_sha256'] = $null
            $row['timestamp_subject'] = $null
            $row['timestamp_cert_sha256'] = $null
            if ($null -ne $signature.SignerCertificate) {
              $row['signer_subject'] = $signature.SignerCertificate.Subject
              $row['signer_cert_sha256'] = $signature.SignerCertificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
            }
            if ($null -ne $signature.TimeStamperCertificate) {
              $row['timestamp_subject'] = $signature.TimeStamperCertificate.Subject
              $row['timestamp_cert_sha256'] = $signature.TimeStamperCertificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
            }
            Require ($row.signature_status -eq 'Valid' -and $null -ne $row.signer_subject -and $row.signer_subject -match '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') "Critical PE signature rejected: $path"
            Require ($version.FileMajorPart -eq 19 -and $version.FileMinorPart -eq 44) "Critical PE is not version 19.44: $path"
            Require ((MeasureFile $path).sha256 -ceq $row.sha256) "Critical PE changed during signature inspection: $path"
            return $row
          }
          function MeasureTree([string]$label, [string]$root, [string]$destination) {
            $root = SafeRoot $root
            $pending = [Collections.Generic.Stack[string]]::new()
            $pending.Push($root)
            $rows = [Collections.Generic.List[string]]::new()
            $count = 0
            $dirCount = 0
            $totalBytes = [long]0
            while ($pending.Count -gt 0) {
              $directory = $pending.Pop()
              $null = SafeItem $directory $true
              $dirCount++
              Require ($dirCount -le 100000) "Directory-count bound exceeded: $label"
              foreach ($item in Get-ChildItem -LiteralPath $directory -Force) {
                Require (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) "Reparse point refused: $($item.FullName)"
                if ($item.PSIsContainer) { $pending.Push($item.FullName); continue }
                $count++
                Require ($count -le 100000) "File-count bound exceeded: $label"
                $relative = [IO.Path]::GetRelativePath($root, $item.FullName).Replace('\', '/')
                Require (-not [IO.Path]::IsPathRooted($relative) -and $relative -notmatch '(^|/)\.\.(/|$)|[\x00-\x1f]') "Invalid relative path: $label"
                $row = MeasureFile $item.FullName
                $totalBytes += $row.bytes
                Require ($totalBytes -le 10737418240) "Byte-count bound exceeded: $label"
                $rows.Add("$($row.sha256)`t$($row.bytes)`t$relative")
              }
            }
            Require ($count -gt 0) "Empty inventory: $label"
            [string[]]$lines = $rows.ToArray()
            [Array]::Sort($lines, [StringComparer]::Ordinal)
            [IO.File]::WriteAllLines($destination, $lines, [Text.UTF8Encoding]::new($false))
            return [ordered]@{ label = $label; root = $root; files = $count; bytes = $totalBytes; manifest = [IO.Path]::GetFileName($destination); sha256 = (MeasureFile $destination).sha256 }
          }
          Require ($env:SG_COMPILE_AUTHORIZATION -ceq 'I_AUTHORIZE_ONE_DISPOSABLE_OBJECT_ONLY_COMPILE') 'Explicit one-run compile authorization missing'
          Require ($env:GITHUB_REPOSITORY -ceq 'HmoobGod/soulgold-windows-lab' -and $env:GITHUB_REF -ceq 'refs/heads/main') 'Wrong isolated staging repository or ref'
          Require ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch' -and $env:GITHUB_RUN_ATTEMPT -ceq '1') 'Manual first attempt only; no reruns'
          Require ($env:GITHUB_ACTOR -ceq 'HmoobGod' -and $env:GITHUB_TRIGGERING_ACTOR -ceq 'HmoobGod') 'Owner dispatch required'
          Require ($env:GITHUB_WORKFLOW_SHA -ceq $env:GITHUB_SHA) 'Workflow and run commit differ'
          Require ($env:ImageVersion -ceq '20261116.370.1' -and $env:ImageOS -ceq 'win22') 'Runner image drift; no compile'
          Require ([Environment]::OSVersion.Version.ToString() -ceq '10.0.20348.0') 'OS build drift; no compile'
          Require ($PSVersionTable.PSVersion.ToString() -ceq '7.6.10') 'PowerShell version drift; no compile'
          Require ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') 'Manual dispatch required'
          Require ($env:RUNNER_OS -eq 'Windows' -and $env:RUNNER_ARCH -eq 'X64') 'Windows x64 runner required'
          Require ([Environment]::Is64BitProcess -and [Environment]::OSVersion.Version.Build -eq 20348) 'Expected 64-bit Windows Server 2022 build 20348'
          Require (-not [string]::IsNullOrWhiteSpace($env:ImageVersion) -and $env:ImageOS -eq 'win22') 'Runner image identity missing or unexpected'
          Require ($env:GITHUB_SHA -cmatch '^[0-9a-f]{40}$' -and $env:GITHUB_RUN_ID -match '^\d+$' -and $env:GITHUB_RUN_ATTEMPT -match '^\d+$') 'Missing run identity'
          $temp = SafeRoot $env:RUNNER_TEMP
          $output = Join-Path $temp 'sg-windows-toolchain-inventory'
          Require (-not (Test-Path -LiteralPath $output)) 'Output directory already exists'
          $null = New-Item -ItemType Directory -Path $output
          $output = SafeRoot $output
          $vsRoot = SafeRoot 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $toolsRoot = SafeRoot (Join-Path $vsRoot 'VC\Tools\MSVC')
          $candidates = @(Get-ChildItem -LiteralPath $toolsRoot -Directory -Force | Where-Object { $_.Name -cmatch '^14\.44\.\d+$' })
          Require ($candidates.Count -eq 1) 'Exactly one MSVC 14.44 (v143) installation required; no automatic fallback'
          $toolset = $candidates[0].Name
          $msvcRoot = SafeRoot $candidates[0].FullName
          $bin = SafeRoot (Join-Path $msvcRoot 'bin\Hostx64\x64')
          $msvcInclude = SafeRoot (Join-Path $msvcRoot 'include')
          $msvcLib = SafeRoot (Join-Path $msvcRoot 'lib\x64')
          $sdkRoot = SafeRoot 'C:\Program Files (x86)\Windows Kits\10'
          $kitsRoot = (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10).KitsRoot10
          Require ((SafeRoot $kitsRoot).TrimEnd('\') -ieq $sdkRoot.TrimEnd('\')) 'SDK registry root mismatch'
          $sdkVersion = '10.0.26100.0'
          $sdkInclude = SafeRoot (Join-Path $sdkRoot "Include\$sdkVersion")
          $sdkUmLib = SafeRoot (Join-Path $sdkRoot "Lib\$sdkVersion\um\x64")
          $sdkUcrtLib = SafeRoot (Join-Path $sdkRoot "Lib\$sdkVersion\ucrt\x64")
          $critical = @(foreach ($name in @('cl.exe', 'c1xx.dll', 'c2.dll')) { MeasureCritical (Join-Path $bin $name) })
          $requiredHeaders = @(foreach ($name in @('array','algorithm','cstdint','cstdio','string','vector','cwchar','cstring')) { MeasureFile (Join-Path $msvcInclude $name) })
          $sdkHeaderRoots = @(foreach ($name in @('um','shared','ucrt')) { SafeRoot (Join-Path $sdkInclude $name) })
          foreach ($name in @('windows.h','bcrypt.h')) {
            $hits = @(foreach ($root in $sdkHeaderRoots) { $p = Join-Path $root $name; if (Test-Path -LiteralPath $p -PathType Leaf) { $p } })
            Require ($hits.Count -eq 1) "Missing or ambiguous SDK header: $name"
            $requiredHeaders += MeasureFile $hits[0]
          }
          $libraries = @(
            MeasureFile (Join-Path $sdkUmLib 'Kernel32.lib')
            MeasureFile (Join-Path $sdkUmLib 'Bcrypt.lib')
            MeasureFile (Join-Path $sdkUcrtLib 'ucrt.lib')
            MeasureFile (Join-Path $msvcLib 'msvcrt.lib')
            MeasureFile (Join-Path $msvcLib 'vcruntime.lib')
            MeasureFile (Join-Path $msvcLib 'msvcprt.lib')
          )
          $trees = @(
            MeasureTree 'msvc-hostx64-targetx64-bin' $bin (Join-Path $output 'msvc-bin.tsv')
            MeasureTree 'msvc-headers' $msvcInclude (Join-Path $output 'msvc-headers.tsv')
            MeasureTree 'sdk-headers' $sdkInclude (Join-Path $output 'sdk-headers.tsv')
          )
          foreach ($row in $critical + $requiredHeaders + $libraries) {
            Require ((MeasureFile $row.path).sha256 -ceq $row.sha256) 'Required input changed after inventory'
          }
          $report = [ordered]@{
            schema = 'sg-windows-toolchain-inventory-v1'
            result = 'INVENTORY_COLLECTED_REVIEW_REQUIRED'
            compile_authorized = $false
            native_authorized = $false
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            windows_version = [Environment]::OSVersion.Version.ToString()
            architecture = $env:RUNNER_ARCH
            workflow_commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            observed_utc = [DateTime]::UtcNow.ToString('o')
            powershell_version = $PSVersionTable.PSVersion.ToString()
            visual_studio_root = $vsRoot
            msvc_toolset = $toolset
            msvc_root = $msvcRoot
            sdk_root = $sdkRoot
            sdk_version = $sdkVersion
            critical_compiler_files = $critical
            required_headers = $requiredHeaders
            required_libraries = $libraries
            inventories = $trees
            limits = 'Host observations only; no dependency closure, execution, build, or publisher-independent attestation. Header and library bytes were hashed, not signature-validated.'
          }
          $reportPath = Join-Path $output 'inventory.json'
          [IO.File]::WriteAllText($reportPath, ($report | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false))
          $reportHash = (MeasureFile $reportPath).sha256
          Write-Host "INVENTORY_COLLECTED_REVIEW_REQUIRED: MSVC $toolset; SDK $sdkVersion; image $env:ImageVersion"
          Write-Host "inventory.json SHA256: $reportHash"
          foreach ($row in $critical) { Write-Host "$($row.sha256) $($row.path) [$($row.file_version)] [$($row.signature_status)]" }
          foreach ($row in $trees) { Write-Host "$($row.sha256) $($row.manifest) ($($row.files) files)" }

          # Compare against measured run 45310694296 / artifact 14882428319, not public version guesses.
          $expected = @'
          {"critical_compiler_files":[{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\cl.exe","bytes":677736,"sha256":"e87e78b3ef6580b75aebda843f8a22e874612d9f766344046551399f898eb226","file_version":"19.44.35230.0","product_version":"14.44.35230.0","machine":"AMD64","signature_status":"Valid","signature_type":"Authenticode","signer_subject":"CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US","signer_cert_sha256":"d33927e4dda9b91def9f8ed282549a49217ed8cacf54577a690963cbc5eff3ed","timestamp_subject":"CN=Microsoft Time-Stamp Service, OU=nShield TSS ESN:9600-05E0-D947, OU=Microsoft America Operations, O=Microsoft Corporation, L=Redmond, S=Washington, C=US","timestamp_cert_sha256":"cc325c61674cdb19441aece8637f05b574a2468d3f754162a2c58d4b059db82a"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\c1xx.dll","bytes":12330336,"sha256":"a9348b973d399e7e042a79be7e22dc054e008381a2ef3d9f394300e41aa47470","file_version":"19.44.35230.0","product_version":"14.44.35230.0","machine":"AMD64","signature_status":"Valid","signature_type":"Authenticode","signer_subject":"CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US","signer_cert_sha256":"c30b441672c82883d92eddac6d24cb57e9960bda4486c7fb5865e74157f35850","timestamp_subject":"CN=Microsoft Time-Stamp Service, OU=nShield TSS ESN:6F1A-05E0-D947, OU=Microsoft Ireland Operations Limited, O=Microsoft Corporation, L=Redmond, S=Washington, C=US","timestamp_cert_sha256":"a0206926361768efe284edd5a123e1360adc7644b5a862fbc9a1d0887221c768"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\c2.dll","bytes":10456376,"sha256":"e2fdfd6505cd6e9b670922733a914fbf22cae5d226943290548f24eaf699267a","file_version":"19.44.35230.0","product_version":"14.44.35230.0","machine":"AMD64","signature_status":"Valid","signature_type":"Authenticode","signer_subject":"CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US","signer_cert_sha256":"d33927e4dda9b91def9f8ed282549a49217ed8cacf54577a690963cbc5eff3ed","timestamp_subject":"CN=Microsoft Time-Stamp Service, OU=nShield TSS ESN:A935-03E0-D947, OU=Microsoft America Operations, O=Microsoft Corporation, L=Redmond, S=Washington, C=US","timestamp_cert_sha256":"e5e7011a35a1521c38b24a0ea944d1a76afe367d4d77659d7591717193841172"}],"required_headers":[{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\include\\array","bytes":29292,"sha256":"48d2c6c4926e08d0d96f41e59f69513737f76107530f68c94d5d9fe668689a15"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\include\\algorithm","bytes":533492,"sha256":"e4cfb31da8ec07af89834d829ea72b20c7e3202476af3b0641cfe8d6ebb245d7"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\include\\cstdint","bytes":2674,"sha256":"7e608450751cd44f43942b20e1c1c455d42872e78e7119361316850644f1fb75"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\include\\cstdio","bytes":2511,"sha256":"d13434f976c70f1ea3f930ad63121bfd8cfb5c736cfc48a91f06a7608b1fbaa0"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\include\\string","bytes":16455,"sha256":"dafa5ec4d069f7e85001d6a03fdcac5bde1d18eb7412240aa5cc7e10c7cddf05"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\include\\vector","bytes":161282,"sha256":"351604d91a2ceac79f9bd9448c0553cccc22711e22955b5938eaf41de98334a6"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\include\\cwchar","bytes":3044,"sha256":"6395a6c56a62c4b02e58f4f5bf6904f7baabd7b90d0de281148ee3c115e7291a"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\include\\cstring","bytes":1532,"sha256":"6f16cc44e5505c1d46e0869b8a7cbabf0be1646203261ab6e885165faceb98a6"},{"path":"C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\um\\windows.h","bytes":7511,"sha256":"b337d661d03a4abefb7b86a2742ce1ad5d19b57cd8b858bd13e7bbcc1dbeeaaa"},{"path":"C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\shared\\bcrypt.h","bytes":79906,"sha256":"0cf4c7a0e55aaaeab9bad8f2ab7b2bfdc20da3b51c1ca2c5ad8919529dbc7526"}],"required_libraries":[{"path":"C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64\\Kernel32.lib","bytes":311908,"sha256":"842f5ce7ad8cf5aab7491b791e7968d2be510ae93f4019d3311797289399d221"},{"path":"C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64\\Bcrypt.lib","bytes":14576,"sha256":"9fe31df255d17b0339391ff80a71bf2c5d442cc301bd2fe6eeea00b626f10785"},{"path":"C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\ucrt\\x64\\ucrt.lib","bytes":285588,"sha256":"7ef4eac926bf597d2f243f16cdfed7e0db22cb3ca34a1d7e088a84c994a03d66"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64\\msvcrt.lib","bytes":8031888,"sha256":"07670951a39739b6d1b50421ae61707ef23c8dff50cdf35f99408711478f3a7c"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64\\vcruntime.lib","bytes":285940,"sha256":"1acbd98b43a4be8373e25c65dcae4412f36f6111d6b64e47e4a2a97a1d16b27b"},{"path":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64\\msvcprt.lib","bytes":4050616,"sha256":"59d3ab1065f0a14bd9b27debef4008a91eafbc7411290013f61091bf12dfca0f"}],"inventories":[{"label":"msvc-hostx64-targetx64-bin","root":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64","files":91,"bytes":98909530,"manifest":"msvc-bin.tsv","sha256":"4e48523901bf17a721ee0f90e023134b06d3b948f233933c8b98f542b0966543"},{"label":"msvc-headers","root":"C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Tools\\MSVC\\14.44.35207\\include","files":361,"bytes":16200441,"manifest":"msvc-headers.tsv","sha256":"42c7a97507013d929fda7836abab00acf0ed89374ebf9d4395dccf7ba1db1685"},{"label":"sdk-headers","root":"C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0","files":5563,"bytes":386817955,"manifest":"sdk-headers.tsv","sha256":"7363646e30aac0d2fc4033e248f6bc294fcb142f9bb89a52121baed27bf0d835"}]}
          '@ | ConvertFrom-Json -AsHashtable
          Require ($toolset -ceq '14.44.35207' -and $sdkVersion -ceq '10.0.26100.0') 'Toolset or SDK drift'
          foreach ($group in @('critical_compiler_files','required_headers','required_libraries','inventories')) {
            $actualRows = $report[$group]
            $expectedRows = $expected[$group]
            Require ($actualRows.Count -eq $expectedRows.Count) "Inventory row count drift: $group"
            for ($i=0; $i -lt $expectedRows.Count; $i++) {
              foreach ($key in $expectedRows[$i].Keys) {
                Require ($actualRows[$i].Contains($key)) "Missing inventory key: $group / $key"
                Require ([string]$actualRows[$i][$key] -ceq [string]$expectedRows[$i][$key]) "Exact inventory drift: $group / $i / $key"
              }
            }
          }
          Write-Host 'EXACT_MEASURED_TOOLCHAIN_MATCH: compile gate preflight passed; no compiler invoked in this step'
      - name: Authorized disposable copy and one object-only compile
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          function Require([bool]$condition, [string]$message) { if (-not $condition) { throw $message } }
          function Hash([string]$path) { return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function SafeDirectory([string]$path) {
            $cursor = [IO.Path]::GetFullPath($path)
            $full = $cursor
            while ($null -ne $cursor) {
              $item = Get-Item -LiteralPath $cursor -Force
              Require ($item.PSIsContainer -and (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0)) "Unsafe directory: $cursor"
              $parent = [IO.Directory]::GetParent($cursor)
              if ($null -eq $parent) { break }
              $cursor = $parent.FullName
            }
            return $full
          }
          function FreshDirectory([string]$path) {
            Require (-not (Test-Path -LiteralPath $path)) "Directory already exists: $path"
            $null = New-Item -ItemType Directory -Path $path
            return (SafeDirectory $path)
          }
          Require ($env:SG_COMPILE_AUTHORIZATION -ceq 'I_AUTHORIZE_ONE_DISPOSABLE_OBJECT_ONLY_COMPILE') 'Explicit one-run compile authorization missing'
          Require ($env:GITHUB_REPOSITORY -ceq 'HmoobGod/soulgold-windows-lab' -and $env:GITHUB_REF -ceq 'refs/heads/main') 'Wrong isolated staging repository or ref'
          Require ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch' -and $env:GITHUB_RUN_ATTEMPT -ceq '1') 'Manual first attempt only; no reruns'
          Require ($env:GITHUB_ACTOR -ceq 'HmoobGod' -and $env:GITHUB_TRIGGERING_ACTOR -ceq 'HmoobGod') 'Owner dispatch required'
          Require ($env:GITHUB_WORKFLOW_SHA -ceq $env:GITHUB_SHA) 'Workflow and run commit differ'
          Require ($env:ImageVersion -ceq '20261116.370.1' -and $env:ImageOS -ceq 'win22') 'Runner image drift; no compile'
          Require ([Environment]::OSVersion.Version.ToString() -ceq '10.0.20348.0') 'OS build drift; no compile'
          Require ($PSVersionTable.PSVersion.ToString() -ceq '7.6.10') 'PowerShell version drift; no compile'

          Require ($env:RUNNER_OS -ceq 'Windows' -and $env:RUNNER_ARCH -ceq 'X64' -and [Environment]::Is64BitProcess) 'Wrong host architecture'
          $inventory = SafeDirectory (Join-Path (SafeDirectory $env:RUNNER_TEMP) 'sg-windows-toolchain-inventory')
          $reportPath = Join-Path $inventory 'inventory.json'
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json -AsHashtable
